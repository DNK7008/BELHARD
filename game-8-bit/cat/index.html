<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дорога домой — 8-битная игра про кошку Лапку</title>
<meta name="description" content="Ретро-платформер в духе старых приставок: кошка Лапка выбралась из коробки в лесу и ищет дорогу домой, где её ждёт Соня.">
<meta name="theme-color" content="#110f14">
<!-- Значок вкладки нарисован прямо здесь, чтобы не нужен был отдельный файл -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<style>
  /* Страница — «тёмная комната», в центре стоит старый телевизор с игрой */
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: radial-gradient(ellipse at 50% 35%, #2b2430 0%, #141117 55%, #0a090c 100%);
    color: #b9ae9c;
    font: 14px/1.5 "Courier New", Courier, monospace;
  }

  /* Корпус телевизора. Экран = корпус минус поля: 960 − 2 × 30 = 900 px в ширину.
     На маленьком экране всё пропорционально ужимается, чтобы влезть без прокрутки */
  .tv {
    width: min(960px, 100%, calc((100vh - 150px) * 1.5 + 60px));
    padding: 26px 30px 14px;
    border-radius: 36px;
    background: linear-gradient(165deg, #3d352e 0%, #27221d 50%, #1b1815 100%);
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, .08),
      inset 0 -4px 0 rgba(0, 0, 0, .45),
      0 30px 70px rgba(0, 0, 0, .75);
  }
  .screen {
    position: relative;
    aspect-ratio: 3 / 2;
    border-radius: 26px / 20px;          /* чуть выпуклый кинескоп */
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 0 6px #0c0b0a, 0 0 0 9px #4a4036;
  }
  .screen canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: crisp-edges;        /* пиксели остаются чёткими квадратами, без размытия */
    image-rendering: pixelated;
  }
  /* Скан-линии, затемнение по краям и блик стекла.
     pointer-events: none — клики проходят сквозь слой к игре */
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background:
      linear-gradient(160deg, rgba(255, 255, 255, .07) 0%, transparent 35%),
      radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, .55) 100%),
      linear-gradient(to bottom, rgba(0, 0, 0, .25) 0 33%, transparent 33% 100%);
    /* Скан-линия повторяется ровно 200 раз — по одной на каждую строку игровых пикселей,
       поэтому совпадает с картинкой при любом размере экрана */
    background-size: auto, auto, 100% calc(100% / 200);
  }
  .panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 8px 0;
  }
  .brand { color: #9d8f7b; font-weight: bold; letter-spacing: .35em; font-size: 13px; }
  .knobs { display: flex; align-items: center; gap: 14px; }
  .knob {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #756b61, #2a2521 70%);
    box-shadow: 0 2px 4px rgba(0, 0, 0, .6);
  }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #ff4a3a; box-shadow: 0 0 8px 2px rgba(255, 74, 58, .6); }

  .hint { margin: 0; text-align: center; }
  kbd {
    display: inline-block;
    min-width: 1.6em;
    padding: 0 .35em;
    border: 1px solid #5a5046;
    border-bottom-width: 3px;
    border-radius: 5px;
    background: #221e1b;
    color: #e8dcc8;
    font: inherit;
    line-height: 1.4;
    text-align: center;
  }

  /* ---------- Телефон ----------
     Кнопки как на джойстике старой приставки. Класс .touch на <html> ставит скрипт,
     когда видит сенсорный экран. Вертикально: экран сверху, кнопки под ним.
     Горизонтально: крестовина слева от экрана, прыжок справа — как на портативной приставке */
  .pad, .rotate { display: none; }
  .touch, .touch body { overscroll-behavior: none; }
  .touch body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "tv tv" "left right" "note note";
    align-content: center;
    gap: 14px 12px;
    padding: 12px;
    touch-action: manipulation;          /* двойной тап не увеличивает страницу */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .touch .hint, .touch .panel { display: none; }
  .touch .tv {
    grid-area: tv;
    justify-self: center;
    width: min(100%, calc((100vh - 210px) * 1.5 + 24px));
    width: min(100%, calc((100dvh - 210px) * 1.5 + 24px));
    padding: 12px;
    border-radius: 22px;
  }
  .touch .pad { display: flex; align-items: center; gap: 10px; touch-action: none; }
  .touch .pad-left { grid-area: left; justify-self: start; }
  .touch .pad-right { grid-area: right; justify-self: end; }
  .touch .rotate { display: block; grid-area: note; margin: 0; text-align: center; font-size: 12px; }
  .pad button {
    width: 68px;
    height: 68px;
    border: 2px solid #56493d;
    border-radius: 16px;
    background: linear-gradient(#3a332d, #1f1b18);
    color: #eee4d2;
    font: bold 22px/1 "Courier New", monospace;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad .dpad { display: flex; gap: 8px; touch-action: none; }
  .pad .small { width: auto; height: 36px; padding: 0 12px; border-radius: 18px; font-size: 12px; }
  .pad .jump {
    width: 84px;
    height: 84px;
    border-color: #5c120b;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e0493a, #9a1c12);
    font-size: 28px;
  }
  .pad .menu { display: flex; flex-direction: column; gap: 8px; }
  .pad button.on { filter: brightness(1.45); transform: translateY(2px); }

  @media (orientation: landscape) {
    .touch body {
      grid-template-columns: auto 1fr auto;
      grid-template-areas: "left tv right";
      gap: 10px;
      padding: 8px;
    }
    .touch .tv {
      width: min(calc(100vw - 330px), calc((100vh - 16px) * 1.5 + 24px));
      width: min(calc(100vw - 330px), calc((100dvh - 16px) * 1.5 + 24px));
    }
    .touch .pad-left, .touch .pad-right { justify-self: center; }
    .touch .pad-right { flex-direction: column-reverse; }
    .touch .rotate { display: none; }
  }
</style>
</head>
<body>

<main class="tv">
  <div class="screen">
    <canvas id="game" width="300" height="200" role="img"
      aria-label="Игра «Дорога домой»: коричневая полосатая кошка Лапка бежит через лес, перепрыгивает мухоморы и реки"></canvas>
  </div>
  <div class="panel" aria-hidden="true">
    <span class="brand">КОТОВИЗОР</span>
    <span class="knobs"><span class="led"></span><span class="knob"></span><span class="knob"></span></span>
  </div>
</main>

<p class="hint">
  <kbd>←</kbd> <kbd>→</kbd> бег &nbsp;·&nbsp; <kbd>↑</kbd> или <kbd>Пробел</kbd> прыжок &nbsp;·&nbsp;
  <kbd>P</kbd> пауза &nbsp;·&nbsp; <kbd>M</kbd> звук
</p>

<!-- Кнопки для телефона (на компьютере спрятаны) -->
<div class="pad pad-left">
  <div class="dpad" aria-label="Крестовина: влево и вправо">
    <button type="button" data-dir="left" aria-label="Влево">◀</button>
    <button type="button" data-dir="right" aria-label="Вправо">▶</button>
  </div>
</div>
<div class="pad pad-right">
  <div class="menu">
    <button type="button" class="small" data-key="start">СТАРТ</button>
    <button type="button" class="small" id="fullscreen" hidden>ВО ВЕСЬ ЭКРАН</button>
  </div>
  <button type="button" class="jump" data-key="jump" aria-label="Прыжок">A</button>
</div>
<p class="rotate">Поверни телефон горизонтально — экран станет больше</p>

<script>
'use strict';

/* =====================================================================
   ДОРОГА ДОМОЙ — 8-битная игра про кошку Лапку.

   Кошка Лапка уснула в коробке, а проснулась в лесу. Нужно добежать
   до дома, где её ждёт девочка Соня, перепрыгивая мухоморы, ежей и реки.

   Всё в одном файле: картинки нарисованы буквами прямо в коде,
   музыка синтезируется на лету. Поэтому игра открывается двойным
   кликом и работает без интернета.

   Оглавление:
     1. Настройки              8. Мир: карта и столкновения
     2. Палитра                9. Кошка
     3. Пиксельный шрифт      10. Объекты: рыбки, мухоморы, ежи
     4. Спрайты               11. Эффекты: брызги, искры, надписи
     5. Уровни и темы         12. Рисование
     6. Звук и музыка         13. Экраны и ход игры
     7. Управление            14. Главный цикл
   ===================================================================== */


// ---------------------------------------------------------------------
// 1. НАСТРОЙКИ
// ---------------------------------------------------------------------
const W = 300, H = 200;      // внутреннее разрешение: 300×200 «кубиков», на экране растянуто в 3 раза — до 900×600
const TILE = 16;             // размер одной клетки карты
const ROWS = 13;             // строк в карте; нижняя видна наполовину, как на старых телевизорах
const GROUND_Y = 11 * TILE;  // верх земли — по нему выравниваем фон

const GRAVITY = 0.32;        // ускорение падения за кадр
const MAX_FALL = 6;          // предельная скорость падения: меньше клетки, чтобы не проскочить сквозь землю
const RUN_SPEED = 1.9;       // максимальная скорость бега
const JUMP_SPEED = 6.6;      // сила прыжка: хватает на 4 клетки вверх и почти на 5 вперёд
const START_LIVES = 9;       // у кошки девять жизней!
const FISH_FOR_LIFE = 50;    // столько рыбок — ещё одна жизнь

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// Сенсорный экран? Тогда показываем кнопки и подписи «СТАРТ» вместо «ENTER»
let isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
function enableTouch() {
  isTouch = true;
  document.documentElement.classList.add('touch');
}
if (isTouch) enableTouch();
window.addEventListener('touchstart', enableTouch, { once: true, passive: true });

// Мелкие помощники
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const pad = (n, len) => String(n).padStart(len, '0');
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
// «Случайное» число от 0 до 1, но для одного и того же n — всегда одно и то же.
// Так трава и цветы на земле не «прыгают» от кадра к кадру
const rnd = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function rect(g, x, y, w, h, color) {
  g.fillStyle = color;
  g.fillRect(x, y, w, h);
}


// ---------------------------------------------------------------------
// 2. ПАЛИТРА — как у старой приставки: немного ярких цветов.
//    Каждая буква в рисунках спрайтов означает свой цвет.
// ---------------------------------------------------------------------
const PAL = {
  o: '#2c1608', // контур — почти чёрный, тёплый коричневый
  k: '#000000', // чёрный: полоски кошки, зрачки, нос ежа
  b: '#a0602c', // коричневая шерсть кошки
  l: '#e8b478', // светлая шерсть: мордочка, грудка, лапки
  p: '#f890a8', // розовый: нос и уши кошки, щёчки Сони
  e: '#b8f018', // жёлто-зелёные глаза
  w: '#fcfcfc', // белый
  r: '#e82818', // красный: шляпка мухомора, бант Сони
  R: '#a01008', // тень под шляпкой, улыбка Сони
  c: '#fce4b0', // кремовый: ножка гриба, мордочка ежа
  y: '#f8b800', // золотая рыбка
  Y: '#fcf0a0', // блик на рыбке
  a: '#d05800', // брюшко рыбки
  h: '#6c5440', // иголки ежа
  H: '#a88c6c', // светлые иголки
  x: '#c8904c', // картон коробки
  X: '#8c5c28', // тень картона
  t: '#ecd8a8', // скотч
  s: '#fcc8a0', // кожа Сони
  g: '#f8c848', // золотистые волосы
  G: '#c88820', // тень на волосах
  d: '#3c8cfc', // голубое платье
  D: '#1c5cc8', // тень на платье
  n: '#6c3010', // туфельки
};


// ---------------------------------------------------------------------
// 3. ПИКСЕЛЬНЫЙ ШРИФТ 5×7 — буквы нарисованы решётками.
//    Хочешь поправить букву — перерисуй её «#» и «.».
// ---------------------------------------------------------------------
const FONT = {};
const FONT_SRC = [
  ['АБВГДЕЁЖ', `
    .###. ##### ####. ##### ..### ##### .#.#. #.#.#
    #...# #.... #...# #.... .#..# #.... ..... #.#.#
    #...# #.... #...# #.... .#..# #.... ##### .###.
    ##### ####. ####. #.... .#..# ####. #.... ..#..
    #...# #...# #...# #.... .#..# #.... ####. .###.
    #...# #...# #...# #.... ##### #.... #.... #.#.#
    #...# ####. ####. #.... #...# ##### ##### #.#.#`],
  ['ЗИЙКЛМНО', `
    .###. #...# .#.#. #...# ..### #...# #...# .###.
    #...# #...# ..#.. #..#. .#..# ##.## #...# #...#
    ....# #..## #...# #.#.. .#..# #.#.# #...# #...#
    ..##. #.#.# #..## ##... .#..# #.#.# ##### #...#
    ....# ##..# #.#.# #.#.. .#..# #...# #...# #...#
    #...# #...# ##..# #..#. .#..# #...# #...# #...#
    .###. #...# #...# #...# #...# #...# #...# .###.`],
  ['ПРСТУФХЦ', `
    ##### ####. .###. ##### #...# ..#.. #...# #..#.
    #...# #...# #...# ..#.. #...# .###. #...# #..#.
    #...# #...# #.... ..#.. #...# #.#.# .#.#. #..#.
    #...# ####. #.... ..#.. .#### #.#.# ..#.. #..#.
    #...# #.... #.... ..#.. ....# #.#.# .#.#. #..#.
    #...# #.... #...# ..#.. #...# .###. #...# #####
    #...# #.... .###. ..#.. .###. ..#.. #...# ....#`],
  ['ЧШЩЪЫЬЭЮЯ', `
    #...# #.#.# #.#.# ##... #...# #.... .###. #..#. .####
    #...# #.#.# #.#.# .#... #...# #.... #...# #.#.# #...#
    #...# #.#.# #.#.# .#... #...# #.... ....# #.#.# #...#
    .#### #.#.# #.#.# .###. ##..# ####. ..### ###.# .####
    ....# #.#.# #.#.# .#..# #.#.# #...# ....# #.#.# ..#.#
    ....# #.#.# ##### .#..# #.#.# #...# #...# #.#.# .#..#
    ....# ##### ....# .###. ##..# ####. .###. #..#. #...#`],
  ['0123456789', `
    .###. ..#.. .###. ##### ...#. ##### ..##. ##### .###. .###.
    #...# .##.. #...# ....# ..##. #.... .#... ....# #...# #...#
    #..## ..#.. ....# ...#. .#.#. ####. #.... ...#. #...# #...#
    #.#.# ..#.. ...#. ..##. #..#. ....# ####. ..#.. .###. .####
    ##..# ..#.. ..#.. ....# ##### ....# #...# .#... #...# ....#
    #...# ..#.. .#... #...# ...#. #...# #...# .#... #...# ...#.
    .###. .###. ##### .###. ...#. .###. .###. .#... .###. .##..`],
  ['DFGIJLNQ', `
    ####. ##### .###. .###. ..### #.... #...# .###.
    #...# #.... #...# ..#.. ...#. #.... #...# #...#
    #...# #.... #.... ..#.. ...#. #.... ##..# #...#
    #...# ####. #.### ..#.. ...#. #.... #.#.# #...#
    #...# #.... #...# ..#.. ...#. #.... #..## #.#.#
    #...# #.... #...# ..#.. #..#. #.... #...# #..#.
    ####. #.... .#### .###. .##.. ##### #...# .##.#`],
  ['RSUVWYZ', `
    ####. .###. #...# #...# #...# #...# #####
    #...# #...# #...# #...# #...# #...# ....#
    #...# #.... #...# #...# #...# .#.#. ...#.
    ####. .###. #...# #...# #.#.# ..#.. ..#..
    #.#.. ....# #...# #...# #.#.# ..#.. .#...
    #..#. #...# #...# .#.#. #.#.# ..#.. #....
    #...# .###. .###. ..#.. .#.#. ..#.. #####`],
  ['.,!?:-+×/←→↑♥()', `
    ..... ..... ..#.. .###. ..... ..... ..... ..... ....# ..... ..... ..#.. ..... ...#. .#...
    ..... ..... ..#.. #...# ..#.. ..... ..#.. #...# ....# ..#.. ..#.. .###. ##.## ..#.. ..#..
    ..... ..... ..#.. ....# ..... ..... ..#.. .#.#. ...#. .#... ...#. #.#.# ##### .#... ...#.
    ..... ..... ..#.. ...#. ..... .###. ##### ..#.. ..#.. ##### ##### ..#.. ##### .#... ...#.
    ..... ..... ..#.. ..#.. ..... ..... ..#.. .#.#. .#... .#... ...#. ..#.. .###. .#... ...#.
    ..... ..#.. ..... ..... ..#.. ..... ..#.. #...# #.... ..#.. ..#.. ..#.. ..#.. ..#.. ..#..
    ..#.. .#... ..#.. ..#.. ..... ..... ..... ..... #.... ..... ..... ..... ..... ...#. .#...`],
];
for (const [chars, block] of FONT_SRC) {
  const lines = block.trim().split('\n').map(line => line.trim().split(/\s+/));
  [...chars].forEach((ch, i) => { FONT[ch] = lines.map(row => row[i]); });
  if (lines.some(row => row.length !== chars.length)) console.warn('Шрифт: не совпадает число букв в блоке', chars);
}
// Латинские буквы, которые выглядят как русские, берём готовыми
for (const [lat, cyr] of Object.entries({ A: 'А', B: 'В', C: 'С', E: 'Е', H: 'Н', K: 'К', M: 'М', O: 'О', P: 'Р', T: 'Т', X: 'Х' })) {
  FONT[lat] = FONT[cyr];
}

// Рисует одну строку. scale — во сколько раз крупнее, g — на каком холсте
function paintText(g, str, x, y, color, scale = 1) {
  g.fillStyle = color;
  for (let i = 0; i < str.length; i++) {
    const glyph = FONT[str[i]];
    if (!glyph) continue;                       // пробел и незнакомые символы пропускаем
    for (let row = 0; row < 7; row++) {
      for (let col = 0; col < 5; col++) {
        if (glyph[row][col] === '#') g.fillRect(x + (i * 6 + col) * scale, y + row * scale, scale, scale);
      }
    }
  }
}

// Пишем текст на экране игры. align: 'left' | 'center' | 'right', shadow — цвет тени
function text(str, x, y, { color = '#fcfcfc', scale = 1, align = 'left', shadow = null, g = ctx } = {}) {
  str = String(str).toUpperCase();
  const width = str.length * 6 * scale - scale;
  if (align === 'center') x -= Math.floor(width / 2);
  if (align === 'right') x -= width;
  x = Math.round(x);
  y = Math.round(y);
  if (shadow) paintText(g, str, x + scale, y + scale, shadow, scale);
  paintText(g, str, x, y, color, scale);
}

// ---------------------------------------------------------------------
// 4. СПРАЙТЫ — картинки нарисованы буквами палитры, «.» — прозрачно.
//    Поменяй буквы — поменяется картинка. Все строки одного рисунка
//    должны быть одинаковой длины.
// ---------------------------------------------------------------------

// Создаёт маленький холст и даёт на нём порисовать
function makeCanvas(w, h, paint) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  paint(c.getContext('2d'));
  return c;
}

// Превращает рисунок из букв в картинку
function sprite(rows) {
  if (rows.some(row => row.length !== rows[0].length)) console.warn('Спрайт: строки разной длины', rows);
  return makeCanvas(rows[0].length, rows.length, g => {
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] !== '.') rect(g, x, y, 1, 1, PAL[row[x]]);
      }
    });
  });
}

// Поворачивает рисунок на четверть оборота (для рыбы, которая выпрыгивает из реки)
function rotateRows(rows, clockwise) {
  const h = rows.length, w = rows[0].length, out = [];
  for (let x = 0; x < w; x++) {
    let line = '';
    for (let y = 0; y < h; y++) line += clockwise ? rows[h - 1 - y][x] : rows[y][w - 1 - x];
    out.push(line);
  }
  return out;
}

// Рисует спрайт; flipX — отразить (смотрит влево), flipY — вверх ногами
function drawSprite(img, x, y, flipX = false, flipY = false) {
  x = Math.round(x);
  y = Math.round(y);
  if (!flipX && !flipY) {
    ctx.drawImage(img, x, y);
    return;
  }
  ctx.save();
  ctx.translate(x + (flipX ? img.width : 0), y + (flipY ? img.height : 0));
  ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

// ---------------------------------------------------------------------
// 6. ЗВУК И МУЗЫКА — всё синтезируется на лету через Web Audio.
//    Инструменты как у приставки: две «пищалки» (прямоугольная волна
//    разной ширины), треугольная волна для баса и шум для барабанов.
// ---------------------------------------------------------------------
let actx = null;                        // звуковой движок; браузер разрешает его только после нажатия
let master, sfxBus, musicBus;           // микшер: общая громкость, эффекты и музыка отдельно
let pulseWide, pulseThin, noiseBuffer;  // «инструменты»
const MUSIC_VOLUME = 0.4;
let muted = false;
try { muted = localStorage.getItem('cat-home-muted') === '1'; } catch (e) { /* хранилище недоступно — не страшно */ }

function initAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;                // совсем старый браузер — играем без звука
  actx = new AudioCtx();
  master = actx.createGain();
  master.gain.value = muted ? 0 : 0.7;
  master.connect(actx.destination);
  sfxBus = actx.createGain();
  sfxBus.gain.value = 0.55;
  sfxBus.connect(master);
  musicBus = newMusicBus();
  pulseWide = makePulseWave(0.25);      // звонкая «пищалка» — для мелодии
  pulseThin = makePulseWave(0.125);     // тонкая и тихая — для аккордов
  noiseBuffer = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}

function newMusicBus() {
  const bus = actx.createGain();
  bus.gain.value = MUSIC_VOLUME;
  bus.connect(master);
  return bus;
}

// Прямоугольная волна нужной ширины, собранная из синусоид (ряд Фурье)
function makePulseWave(duty) {
  const n = 64, real = new Float32Array(n), imag = new Float32Array(n);
  for (let i = 1; i < n; i++) {
    real[i] = Math.sin(2 * Math.PI * i * duty) / (i * Math.PI);
    imag[i] = (1 - Math.cos(2 * Math.PI * i * duty)) / (i * Math.PI);
  }
  return actx.createPeriodicWave(real, imag);
}

// Одна нота: частота, длительность, тембр и громкость
function tone(bus, time, freq, dur, { wave = 'square', vol = 0.2, slide = 0, sustain = 0.7, vibrato = 0 } = {}) {
  const osc = actx.createOscillator();
  if (wave === 'wide') osc.setPeriodicWave(pulseWide);
  else if (wave === 'thin') osc.setPeriodicWave(pulseThin);
  else osc.type = wave;
  osc.frequency.setValueAtTime(freq, time);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, time + dur);   // звук «съезжает» вверх или вниз
  if (vibrato) {                        // лёгкое дрожание длинных нот — как у живого певца
    const lfo = actx.createOscillator(), depth = actx.createGain();
    lfo.frequency.value = 5.5;
    depth.gain.setValueAtTime(0, time);
    depth.gain.linearRampToValueAtTime(vibrato, time + Math.min(0.25, dur));
    lfo.connect(depth).connect(osc.detune);
    lfo.start(time);
    lfo.stop(time + dur + 0.05);
  }
  const env = actx.createGain();        // громкость: быстро вверх, потом плавно вниз — без щелчков
  const release = Math.min(0.05, dur / 3);
  env.gain.setValueAtTime(0, time);
  env.gain.linearRampToValueAtTime(vol, time + 0.005);
  env.gain.linearRampToValueAtTime(vol * sustain, time + dur - release);
  env.gain.linearRampToValueAtTime(0, time + dur);
  osc.connect(env).connect(bus);
  osc.start(time);
  osc.stop(time + dur + 0.05);
}

// Шум — для барабанов и всплесков
function noise(bus, time, dur, { vol = 0.2, type = 'highpass', freq = 5000, q = 1 } = {}) {
  const src = actx.createBufferSource();
  src.buffer = noiseBuffer;
  const filter = actx.createBiquadFilter();
  filter.type = type;
  filter.frequency.value = freq;
  filter.Q.value = q;
  const env = actx.createGain();
  env.gain.setValueAtTime(vol, time);
  env.gain.exponentialRampToValueAtTime(0.001, time + dur);
  src.connect(filter).connect(env).connect(bus);
  src.start(time, Math.random() * 0.5, dur + 0.05);
}

// «Мяу»: высота звука и окраска гласной меняются — м-я-у
function meow(time) {
  const d = 0.55;
  const osc = actx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(420, time);
  osc.frequency.linearRampToValueAtTime(720, time + 0.14);
  osc.frequency.linearRampToValueAtTime(600, time + 0.32);
  osc.frequency.linearRampToValueAtTime(380, time + d);
  const filter = actx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = 2.5;
  filter.frequency.setValueAtTime(600, time);
  filter.frequency.linearRampToValueAtTime(1700, time + 0.16);
  filter.frequency.linearRampToValueAtTime(700, time + d);
  const env = actx.createGain();
  env.gain.setValueAtTime(0, time);
  env.gain.linearRampToValueAtTime(0.5, time + 0.07);
  env.gain.linearRampToValueAtTime(0.4, time + d - 0.12);
  env.gain.linearRampToValueAtTime(0, time + d);
  osc.connect(filter).connect(env).connect(sfxBus);
  osc.start(time);
  osc.stop(time + d + 0.05);
}

// ---- Ноты ----
const NOTE_STEPS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
// «F#5» → номер ноты (как клавиша пианино); ля первой октавы A4 = 69 = 440 Гц
function noteToMidi(name) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  return 12 * (Number(m[3]) + 1) + NOTE_STEPS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const midiToFreq = n => 440 * Math.pow(2, (n - 69) / 12);

// Мелодия записана восьмыми: «G5 . B5 -» — нота, пауза, нота, «-» тянет предыдущую ноту
function parseMelody(textLine) {
  const tokens = textLine.trim().split(/\s+/), notes = [];
  tokens.forEach((tok, i) => {
    if (tok === '.' || tok === '-') return;
    let len = 1;
    while (tokens[i + len] === '-') len++;
    notes.push({ at: i, midi: noteToMidi(tok), len });
  });
  return notes;
}

// Аккорд «Em» → звуки аккорда и нота для баса
function parseChord(name) {
  const m = /^([A-G])([#b]?)(m?)$/.exec(name);
  const root = (NOTE_STEPS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12;
  let bass = 36 + root;
  if (bass < 40) bass += 12;            // бас держим в удобном диапазоне
  return { root, tones: [0, m[3] ? 3 : 4, 7], bass };
}

// ---- Песни ----
// chords — аккорд на каждый такт («C+D» — полтакта C, полтакта D),
// lead — мелодия по тактам, bass — рисунок баса восьмыми
// (0 — основной звук аккорда, 7 — квинта, 12 — октава выше, null — тишина),
// drums — барабаны шестнадцатыми: k — бочка, s — малый, h — тарелочка.
const SONGS = {
  // Уровень 1: бодрая лесная тропинка, соль мажор

      'G5 . B5 A5 G5 . D5 .',   'E5 . G5 F#5 E5 . G5 A5', 'B5 . A5 G5 A5 . F#5 D5', 'G5 - - - . . . D5',
      'E5 - - D5 C5 - D5 E5',   'F#5 - - E5 D5 - E5 F#5', 'G5 - - F#5 E5 - F#5 G5', 'B5 - - - A5 - G5 -',
      'E5 - - D5 C5 - D5 E5',   'F#5 - - E5 D5 - E5 F#5', 'G5 - D5 - B4 - D5 -',    'A5 - - - F#5 - D5 -',

      'F#5 - - E5 - - D5 -',    'E5 - - A5 - - G5 -',     'F#5 - - E5 - - D5 -',    'E5 - - - - - . .',
      'G5 - F#5 - E5 - B4 -',   'C#5 - E5 - A5 - G5 -',   'F#5 - - - A5 - F#5 -',   'D5 - - - F#5 - B5 -',
      'G5 - - F#5 E5 - F#5 G5', 'A5 - - G5 E5 - C#5 -',   'D5 - F#5 - A5 - D6 -',   'D6 - - - - - . .',

// Короткие мелодии-сигналы
const JINGLES = {
  clear:    ['G5 C6 E6 G6 - - E6 G6 - - - -', 170],
  home:     ['C5 E5 G5 C6 - B5 C6 D6 E6 - - - - - - -', 150],
  sad:      ['G4 - F#4 - F4 - E4 - - - - -', 200],
  gameover: ['A4 - C5 - B4 - G#4 - A4 - - - - - - -', 110],
};

// Раскладываем песню по шестнадцатым долям: в каждой доле — список нот для разных инструментов
function buildSong(def) {
  const bars = def.chords.split(' ');
  const steps = Array.from({ length: bars.length * 16 }, () => []);
  def.lead.forEach((line, bar) => {
    for (const n of parseMelody(line)) steps[bar * 16 + n.at * 2].push({ inst: 'lead', midi: n.midi, len: n.len * 2 });
  });
  bars.forEach((barName, bar) => {
    const halves = barName.split('+');
    for (let s = 0; s < 16; s++) {
      const chord = parseChord(halves[halves.length > 1 && s >= 8 ? 1 : 0]);
      const at = steps[bar * 16 + s];
      // звук аккорда в диапазоне соль малой — фа-диез первой октавы, под мелодией
      const chordNote = i => 55 + (chord.root + chord.tones[i] + 5) % 12;
      if (s % 2 === 0 && def.bass[s / 2] !== null) {
        let len = 2;                           // нота баса тянется до следующей — звук плотнее
        while (s / 2 + len / 2 < 8 && def.bass[s / 2 + len / 2] === null) len += 2;
        at.push({ inst: 'bass', midi: chord.bass + def.bass[s / 2], len });
      }
      if (def.harmony === 'arp') at.push({ inst: 'arp', midi: chordNote([0, 1, 2, 1][s % 4]), len: 1 });
      if (def.harmony === 'stab' && s % 4 === 2) [0, 1, 2].forEach(i => at.push({ inst: 'stab', midi: chordNote(i), len: 1 }));
      if (def.harmony === 'broken' && s % 2 === 0) at.push({ inst: 'arp', midi: chordNote([0, 1, 2, 1][(s / 2) % 4]), len: 2 });
      const drum = { k: 'kick', s: 'snare', h: 'hat' }[def.drums[s]];
      if (drum) at.push({ inst: drum });
    }
  });
  return { bpm: def.bpm, steps };
}
const SONG_DATA = Object.fromEntries(Object.entries(SONGS).map(([name, def]) => [name, buildSong(def)]));

// Сыграть одну ноту песни в нужный момент
function playEvent(ev, time, stepDur) {
  const dur = (ev.len || 1) * stepDur;
  const f = ev.midi ? midiToFreq(ev.midi) : 0;
  switch (ev.inst) {
    case 'lead':  tone(musicBus, time, f, dur * 0.92, { wave: 'wide', vol: 0.2, sustain: 0.65, vibrato: dur > 0.35 ? 10 : 0 }); break;
    case 'arp':   tone(musicBus, time, f, dur * 0.8, { wave: 'thin', vol: 0.055, sustain: 0.5 }); break;
    case 'stab':  tone(musicBus, time, f, dur * 0.9, { wave: 'thin', vol: 0.045, sustain: 0.4 }); break;
    case 'bass':  tone(musicBus, time, f, dur * 0.85, { wave: 'triangle', vol: 0.38, sustain: 0.9 }); break;
    case 'kick':  tone(musicBus, time, 150, 0.12, { wave: 'triangle', vol: 0.5, slide: 45, sustain: 0.3 }); break;
    case 'snare': noise(musicBus, time, 0.12, { vol: 0.16, type: 'bandpass', freq: 1800, q: 0.8 }); break;
    case 'hat':   noise(musicBus, time, 0.035, { vol: 0.07, type: 'highpass', freq: 7000 }); break;
  }
}

// Проигрыватель: каждый кадр заранее ставит в очередь ноты на ближайшие доли секунды
const music = { name: '', song: null, step: 0, time: 0, paused: false };

function playMusic(name) {
  if (!actx || music.name === name) return;
  stopMusic();
  music.name = name;
  music.song = SONG_DATA[name];
  music.step = 0;
  music.time = actx.currentTime + 0.08;
}

function stopMusic() {
  music.name = '';
  music.song = null;
  music.paused = false;
  if (!actx) return;
  // Уже запланированные ноты глушим вместе со старым «проводом», а музыку дальше ведём по новому
  const old = musicBus;
  old.gain.setTargetAtTime(0, actx.currentTime, 0.02);
  setTimeout(() => old.disconnect(), 400);
  musicBus = newMusicBus();
}

function pauseMusic(paused) {
  if (!actx || !music.song) return;
  music.paused = paused;
  musicBus.gain.setTargetAtTime(paused ? 0 : MUSIC_VOLUME, actx.currentTime, 0.02);
  if (!paused) music.time = actx.currentTime + 0.05;
}

function updateMusic() {
  if (!actx || !music.song || music.paused) return;
  const stepDur = 60 / music.song.bpm / 4;
  if (music.time < actx.currentTime - 0.25) music.time = actx.currentTime + 0.05;  // вкладка «спала» — не догоняем
  while (music.time < actx.currentTime + 0.2) {
    for (const ev of music.song.steps[music.step]) playEvent(ev, music.time, stepDur);
    music.time += stepDur;
    music.step = (music.step + 1) % music.song.steps.length;
  }
}

function playJingle(name) {
  if (!actx) return;
  const [line, bpm] = JINGLES[name];
  const stepDur = 60 / bpm / 2;
  const t0 = actx.currentTime + 0.03;
  for (const n of parseMelody(line)) {
    const t = t0 + n.at * stepDur, d = n.len * stepDur * 0.95;
    tone(sfxBus, t, midiToFreq(n.midi), d, { wave: 'wide', vol: 0.2, sustain: 0.7 });
    tone(sfxBus, t, midiToFreq(n.midi - 12), d, { wave: 'triangle', vol: 0.3, sustain: 0.9 });
  }
}

function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('cat-home-muted', muted ? '1' : '0'); } catch (e) { /* не страшно */ }
  if (actx) master.gain.setTargetAtTime(muted ? 0 : 0.7, actx.currentTime, 0.02);
  showToast(muted ? 'ЗВУК ВЫКЛ' : 'ЗВУК ВКЛ');
}

// 7. УПРАВЛЕНИЕ: клавиатура и кнопки на экране телефона
// ---------------------------------------------------------------------
const input = { left: false, right: false, jump: false };   // что зажато прямо сейчас
const pressed = {};                                          // что нажали в этом кадре

// e.code — это физическая клавиша, поэтому WASD работает и в русской раскладке
const KEYS = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump',
  Enter: 'start', NumpadEnter: 'start',
  KeyP: 'pause', Escape: 'pause',
  KeyM: 'mute',
};

function setKey(action, down) {
  if (down && !input[action]) pressed[action] = true;
  input[action] = down;
}

window.addEventListener('keydown', e => {
  const action = KEYS[e.code];
  if (!action) return;
  e.preventDefault();             // стрелки и пробел двигают кошку, а не прокручивают страницу
  initAudio();                    // звук браузер разрешает только после действия игрока
  if (e.repeat) return;           // зажатая клавиша не «нажимается» много раз
  if (action === 'mute') toggleMute();
  else setKey(action, true);
});
window.addEventListener('keyup', e => {
  const action = KEYS[e.code];
  if (action && action !== 'mute') setKey(action, false);
});

// Ушли в другую вкладку или окно — отпускаем кнопки и ставим паузу
function releaseAll() {
  for (const k in input) input[k] = false;
  document.querySelectorAll('.pad .on').forEach(b => b.classList.remove('on'));
}
window.addEventListener('blur', () => { releaseAll(); autoPause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); autoPause(); } });

// Крестовина — одна зона: левая половина «влево», правая «вправо».
// Большой палец можно не отрывать и просто перекатывать с одной стрелки на другую
const dpad = document.querySelector('.dpad');
let dpadFinger = null;
function dpadMove(e) {
  const box = dpad.getBoundingClientRect();
  const left = e.clientX < box.left + box.width / 2;
  setKey('left', left);
  setKey('right', !left);
  dpad.children[0].classList.toggle('on', left);
  dpad.children[1].classList.toggle('on', !left);
}
function dpadEnd(e) {
  if (e.pointerId !== dpadFinger) return;
  dpadFinger = null;
  setKey('left', false);
  setKey('right', false);
  for (const b of dpad.children) b.classList.remove('on');
}
// Палец уехал за край кнопки — всё равно следим за ним.
// Некоторые браузеры этого не умеют — тогда просто работаем без «захвата»
function capture(el, e) {
  try { el.setPointerCapture(e.pointerId); } catch (err) { /* не страшно */ }
}
dpad.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  dpadFinger = e.pointerId;
  capture(dpad, e);
  dpadMove(e);
});
dpad.addEventListener('pointermove', e => { if (e.pointerId === dpadFinger) dpadMove(e); });
dpad.addEventListener('pointerup', dpadEnd);
dpad.addEventListener('pointercancel', dpadEnd);

// Кнопки «A» (прыжок) и «СТАРТ»
document.querySelectorAll('.pad [data-key]').forEach(btn => {
  const action = btn.dataset.key;
  const release = () => { setKey(action, false); btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    capture(btn, e);
    setKey(action, true);
    btn.classList.add('on');
  });
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
});
// Долгое нажатие не должно открывать меню «сохранить картинку» и т. п.
document.querySelectorAll('.pad, canvas').forEach(el => el.addEventListener('contextmenu', e => e.preventDefault()));

// Во весь экран — только там, где браузер это умеет (на iPhone кнопки не будет)
const fullscreenBtn = document.getElementById('fullscreen');
if (document.documentElement.requestFullscreen) {
  fullscreenBtn.hidden = false;
  fullscreenBtn.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
      return;
    }
    document.documentElement.requestFullscreen()
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
      .catch(() => { /* не разрешили — играем как есть */ });
  });
}

// Тап или клик по экрану игры — «дальше» на заставках (во время игры ничего не делает)
canvas.addEventListener('pointerdown', () => {
  initAudio();
  if (state !== 'play') pressed.start = true;
});
