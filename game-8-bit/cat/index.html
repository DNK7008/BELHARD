// 8. МИР: карта, клетки, столкновения, подготовка картинок уровня
// ---------------------------------------------------------------------
let level = LEVELS[0];     // описание текущего уровня
let theme = THEMES.morning;
let tiles = [];            // карта: tiles[строка][столбец] — буква клетки
let cols = 0;              // ширина уровня в клетках
let objects = [];          // рыбки, мухоморы, ежи, флажки, дом...
let effects = [];          // брызги, искры, дымок
let popups = [];           // всплывающие надписи и облачка с репликами
let bumps = [];            // коробки, которые подпрыгнули от удара головой
let checkpoint = { x: 0, y: 0 };
let camX = 0;              // насколько камера сдвинута вправо
let bg = null;             // заранее нарисованный фон: небо, холмы, лес
let levelCanvas = null;    // заранее нарисованные земля, камни и украшения всего уровня

const SOLID = '#SLBb';     // клетки, сквозь которые не пройти
const isSolid = t => SOLID.includes(t);

function tileAt(tx, ty) {
  if (ty < 0 || ty >= ROWS) return '.';   // выше и ниже карты — пустота
  if (tx < 0 || tx >= cols) return '#';   // слева и справа — невидимая стена
  return tiles[ty][tx];
}

// Двигаем объект по горизонтали; упёрся в стену — останавливаем. Возвращает true, если упёрся
function moveX(e) {
  e.x += e.vx;
  const top = Math.floor(e.y / TILE), bottom = Math.floor((e.y + e.h - 0.01) / TILE);
  if (e.vx > 0) {
    const tx = Math.floor((e.x + e.w - 0.01) / TILE);
    for (let ty = top; ty <= bottom; ty++) {
      if (isSolid(tileAt(tx, ty))) { e.x = tx * TILE - e.w; e.vx = 0; return true; }
    }
  } else if (e.vx < 0) {
    const tx = Math.floor(e.x / TILE);
    for (let ty = top; ty <= bottom; ty++) {
      if (isSolid(tileAt(tx, ty))) { e.x = (tx + 1) * TILE; e.vx = 0; return true; }
    }
  }
  return false;
}

// Двигаем по вертикали: приземляемся на землю и мостики, бьёмся головой о потолок.
// Если ударились головой — возвращает клетку, в которую ударились
function moveY(e) {
  const oldBottom = e.y + e.h;
  e.y += e.vy;
  e.onGround = false;
  const left = Math.floor(e.x / TILE), right = Math.floor((e.x + e.w - 0.01) / TILE);
  if (e.vy > 0) {
    const ty = Math.floor((e.y + e.h - 0.01) / TILE);
    for (let tx = left; tx <= right; tx++) {
      const t = tileAt(tx, ty);
      // На мостик «=» встаём, только если были над ним, — снизу он пропускает
      if (isSolid(t) || (t === '=' && oldBottom <= ty * TILE + 0.01)) {
        e.y = ty * TILE - e.h;
        e.vy = 0;
        e.onGround = true;
        return null;
      }
    }
  } else if (e.vy < 0) {
    const ty = Math.floor(e.y / TILE);
    let hit = null;
    const center = e.x + e.w / 2;
    for (let tx = left; tx <= right; tx++) {
      if (!isSolid(tileAt(tx, ty))) continue;
      // Из двух клеток над головой выбираем ту, что ближе к центру кошки
      if (!hit || Math.abs(tx * TILE + 8 - center) < Math.abs(hit.tx * TILE + 8 - center)) hit = { tx, ty };
    }
    if (hit) {
      e.y = (ty + 1) * TILE;
      e.vy = 0;
      return hit;
    }
  }
  return null;
}

// Где в этом столбце поверхность воды
function waterTop(tx) {
  for (let ty = 0; ty < ROWS; ty++) if (tiles[ty][tx] === '~') return ty * TILE + 5;
  return H + 100;
}

// ---- Картинки, которые рисуем один раз при загрузке уровня ----

// Круг из пикселей
function pixelCircle(g, cx, cy, r, color) {
  g.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt(r * r - dy * dy));
    g.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
  }
}

// Силуэт ёлки из трёх ярусов-«ступенек»
function pineSilhouette(g, cx, bottom, h, color) {
  g.fillStyle = color;
  const tier = Math.max(4, Math.floor(h / 3));
  for (let y = 0; y < h; y++) {
    const t = Math.min(2, Math.floor(y / tier)), yin = y - t * tier;
    const hw = Math.floor(yin * 0.6) + t * 2 + 1;
    g.fillRect(cx - hw, bottom - h + y, hw * 2 + 1, 1);
  }
}

// Фон: небо с солнцем, облако, дальние холмы и два ряда леса.
// Холмы и лес шириной 512 пикселей повторяются по кругу и едут медленнее земли — так кажется, что они далеко
function buildBackground(th) {
  const sky = makeCanvas(W, H, g => {
    // Небо — ровными полосами: плавных градиентов у старых приставок не было
    th.sky.forEach((color, i) => rect(g, 0, i * 30, W, i === th.sky.length - 1 ? H : 30, color));
    const s = th.sun;
    pixelCircle(g, s.x, s.y, s.r + 3, s.glow);
    pixelCircle(g, s.x, s.y, s.r, s.color);
    if (s.stripes) {   // полоски на закатном солнце
      [[4, 1], [8, 2], [12, 2], [16, 3]].forEach(([dy, h]) => rect(g, s.x - s.r - 3, s.y + dy, (s.r + 3) * 2 + 1, h, th.sky[4]));
    }
  });
  const cloud = makeCanvas(40, 16, g => {
    const puffs = [[11, 10, 6], [20, 7, 8], [29, 10, 6]];
    for (let y = 0; y < 16; y++) {
      for (let x = 0; x < 40; x++) {
        if (puffs.some(([cx, cy, r]) => (x - cx) ** 2 + (y - cy) ** 2 <= r * r)) rect(g, x, y, 1, 1, th.cloud[y >= 12 ? 1 : 0]);
      }
    }
  });
  const hills = makeCanvas(512, H, g => {
    for (let x = 0; x < 512; x++) {
      const k = 2 * Math.PI * x / 512;
      const top = Math.round(120 - 16 * Math.sin(2 * k + 0.6) - 8 * Math.sin(5 * k + 2.1) - 3 * Math.sin(11 * k));
      rect(g, x, top, 1, H - top, th.hills);
      rect(g, x, top, 1, 1, th.hillsRim);
    }
  });
  const forest = (color, spacing, minH, maxH, seed) => makeCanvas(512, H, g => {
    rect(g, 0, GROUND_Y - 6, 512, H, color);
    for (let x = 0; x < 512; x += spacing) {
      const h = minH + Math.floor(rnd(x + seed) * (maxH - minH));
      const cx = x + Math.floor(rnd(x * 3 + seed) * spacing * 0.6);
      for (const shift of [-512, 0, 512]) pineSilhouette(g, cx + shift, GROUND_Y - 4, h, color);
    }
  });
  return {
    sky, cloud, hills,
    mid: forest(th.forestFar, 13, 22, 40, 1),
    near: forest(th.forestNear, 19, 34, 58, 7),
  };
}

// Кружок листвы с тенью и бликами
function leafBlob(g, cx, cy, r, [light, mid, dark]) {
  pixelCircle(g, cx, cy, r, dark);
  pixelCircle(g, cx - 1, cy - 1, r - 2, mid);
  for (let i = 0; i < 4; i++) {
    rect(g, cx - r / 2 + Math.floor(rnd(cx * 7 + i) * r), cy - r / 2 + Math.floor(rnd(cy * 5 + i) * r * 0.8), 2, 1, light);
  }
}

// Украшения: ёлка, берёза, куст, забор
function buildDecor(th) {
  const trunk = '#6c3c14';
  const pine = makeCanvas(32, 60, g => {
    rect(g, 14, 50, 4, 10, trunk);
    for (const t of [{ bottom: 53, h: 20, hw: 14 }, { bottom: 38, h: 18, hw: 11 }, { bottom: 24, h: 18, hw: 8 }]) {
      for (let i = 0; i < t.h; i++) {
        const y = t.bottom - t.h + i, hw = Math.round((i + 1) / t.h * t.hw);
        rect(g, 16 - hw, y, hw * 2, 1, th.leaves[2]);
        rect(g, 16 - hw, y, hw, 1, th.leaves[1]);
        if (i % 3 === 0) rect(g, 16 - hw, y, 2, 1, th.leaves[0]);
      }
    }
  });
  const birch = makeCanvas(32, 72, g => {
    rect(g, 14, 18, 4, 54, '#f0f0e8');
    rect(g, 17, 18, 1, 54, '#b8b8b0');
    for (let y = 26, i = 0; y < 70; y += 7, i++) rect(g, 14 + (i % 2), y, 2, 1, '#202020');
    leafBlob(g, 10, 18, 9, th.leaves);
    leafBlob(g, 22, 12, 10, th.leaves);
    leafBlob(g, 23, 25, 7, th.leaves);
    leafBlob(g, 12, 29, 6, th.leaves);
  });
  const bush = makeCanvas(32, 16, g => {
    leafBlob(g, 9, 11, 7, th.leaves);
    leafBlob(g, 23, 11, 7, th.leaves);
    leafBlob(g, 16, 8, 8, th.leaves);
    rect(g, 2, 15, 28, 1, th.leaves[2]);
  });
  const fence = makeCanvas(16, 16, g => {
    for (const y of [6, 11]) { rect(g, 0, y, 16, 2, '#c08040'); rect(g, 0, y + 1, 16, 1, '#7c4818'); }
    for (const x of [2, 10]) {
      rect(g, x, 3, 4, 13, '#c88c48');
      rect(g, x, 3, 1, 13, '#e8b878');
      rect(g, x + 3, 3, 1, 13, '#7c4818');
      rect(g, x + 1, 2, 2, 1, '#c88c48');
    }
  });
  return { pine, birch, bush, fence };
}

// ---- Клетки карты ----
function drawGroundTile(g, x, y, seed, open, th) {
  const [dirt, crumb, dark] = th.dirt;
  rect(g, x, y, TILE, TILE, dirt);
  for (let i = 0; i < 5; i++) {   // камешки и крошки
    rect(g, x + 1 + Math.floor(rnd(seed + i * 1.7) * 13), y + 2 + Math.floor(rnd(seed + i * 3.1 + 9) * 13), 2, 1, i % 2 ? crumb : dark);
  }
  if (open.left) rect(g, x, y, 1, TILE, dark);        // край обрыва
  if (open.right) rect(g, x + 15, y, 1, TILE, dark);
  if (!open.top) return;
  const [light, grass, deep] = th.grass;               // сверху растёт трава
  rect(g, x, y, TILE, 4, grass);
  rect(g, x, y, TILE, 1, light);
  for (let i = 0; i < TILE; i += 2) rect(g, x + i, y + 4, 2, rnd(seed + i) < 0.5 ? 1 : 2, deep);
  const r = rnd(seed * 3.3);                           // травинки и цветочки
  if (r < 0.3) {
    rect(g, x + 4, y - 2, 1, 2, grass);
    rect(g, x + 6, y - 3, 1, 3, light);
    rect(g, x + 8, y - 2, 1, 2, grass);
  } else if (r < 0.42) {
    rect(g, x + 10, y - 3, 1, 3, deep);
    rect(g, x + 9, y - 4, 3, 1, r < 0.36 ? '#f8f8f8' : '#fcd800');
    rect(g, x + 10, y - 4, 1, 1, '#f87858');
  }
}

function drawStoneTile(g, x, y) {
  rect(g, x + 1, y, 14, 16, '#3c3c3c');
  rect(g, x, y + 1, 16, 14, '#3c3c3c');
  rect(g, x + 1, y + 1, 14, 14, '#9c9c9c');
  rect(g, x + 2, y + 2, 6, 2, '#d8d8d8');
  rect(g, x + 2, y + 2, 2, 5, '#d8d8d8');
  rect(g, x + 1, y + 13, 14, 2, '#6c6c6c');
  rect(g, x + 13, y + 3, 2, 11, '#6c6c6c');
  rect(g, x + 9, y + 7, 2, 1, '#6c6c6c');
}

function drawLogTile(g, x, y, leftEnd, rightEnd) {
  rect(g, x, y + 1, TILE, 15, '#8c5424');
  rect(g, x, y + 1, TILE, 1, '#4c2808');
  rect(g, x, y + 2, TILE, 2, '#b07038');
  rect(g, x, y + 7, TILE, 1, '#6c3c14');
  rect(g, x, y + 11, TILE, 1, '#6c3c14');
  rect(g, x, y + 15, TILE, 1, '#4c2808');
  for (const [end, ex] of [[leftEnd, x], [rightEnd, x + 11]]) {
    if (!end) continue;                                 // спил бревна с кольцами
    rect(g, ex, y + 2, 5, 13, '#4c2808');
    rect(g, ex + 1, y + 3, 3, 11, '#e0b878');
    rect(g, ex + 2, y + 6, 1, 5, '#a87840');
  }
}

function drawPlankTile(g, x, y) {
  rect(g, x, y, TILE, 5, '#c07830');
  rect(g, x, y, TILE, 1, '#e8a860');
  rect(g, x, y + 4, TILE, 1, '#6c3810');
  rect(g, x + 7, y + 1, 1, 3, '#6c3810');
  rect(g, x + 2, y + 2, 1, 1, '#3c1c08');
  rect(g, x + 12, y + 2, 1, 1, '#3c1c08');
}

// Всю неподвижную часть уровня рисуем один раз в большую картинку.
// Потом каждый кадр просто показываем её нужный кусок — так быстрее
function renderLevel(decor) {
  const D = buildDecor(theme);
  return makeCanvas(cols * TILE, ROWS * TILE, g => {
    for (const d of decor) {
      const ground = d.y + TILE;          // украшение стоит на земле под своей клеткой
      if (d.ch === 't') g.drawImage(D.pine, d.x - 8, ground - 60);
      if (d.ch === 'T') g.drawImage(D.birch, d.x - 8, ground - 72);
      if (d.ch === '*') g.drawImage(D.bush, d.x - 8, ground - 16);
      if (d.ch === 'F') g.drawImage(D.fence, d.x, ground - 16);
    }
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < cols; tx++) {
        const t = tiles[ty][tx], x = tx * TILE, y = ty * TILE;
        if (t === '#') {
          drawGroundTile(g, x, y, tx * 31 + ty * 7, {
            top: !isSolid(tileAt(tx, ty - 1)),
            left: !isSolid(tileAt(tx - 1, ty)),
            right: !isSolid(tileAt(tx + 1, ty)),
          }, theme);
        }
        if (t === 'S') drawStoneTile(g, x, y);
        if (t === 'L') drawLogTile(g, x, y, tileAt(tx - 1, ty) !== 'L', tileAt(tx + 1, ty) !== 'L');
        if (t === '=') drawPlankTile(g, x, y);
      }
    }
  });
}

// Загружаем уровень: разбираем карту, расставляем объекты, рисуем картинки
function loadLevel(index) {
  level = LEVELS[index];
  theme = THEMES[level.theme];
  tiles = level.map.map(row => row.split(''));
  cols = tiles[0].length;
  objects = [];
  effects = [];
  popups = [];
  bumps = [];
  const decor = [];
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < cols; tx++) {
      const ch = tiles[ty][tx], x = tx * TILE, y = ty * TILE;
      if (ch === 'P') {
        placeCat(x, y);
        checkpoint = { x, y };
        if (level.startInBox) {
          cat.inBox = true;
          cat.hidden = true;
          objects.push({ type: 'startbox', x: x - 4, y, t: 0, open: false, peek: 9 });
        }
      } else if (ch === 'o') objects.push({ type: 'fish', x: x + 2, y: y + 4, w: 12, h: 8, phase: tx });
      else if (ch === 'M') objects.push({ type: 'shroom', x: x + 3, y: y + 5, w: 10, h: 11, sx: x, sy: y });
      else if (ch === 'h') objects.push({ type: 'hog', x: x + 1, y: y + 6, w: 14, h: 10, homeX: x + 1, vx: 0, vy: 0, dir: -1, anim: 0, active: false });
      else if (ch === 'f') {
        objects.push({ type: 'jumper', homeX: x + 4, x: x + 4, y: GROUND_Y + 8, w: 8, h: 12, vy: 0, wait: 40 + (tx % 4) * 25, flying: false });
        tiles[ty][tx] = '~';
        continue;
      } else if (ch === 'C') objects.push({ type: 'flag', x, y, active: false, raise: 0 });
      else if (ch === 'E') objects.push({ type: 'exit', x, y });
      else if (ch === 'D') objects.unshift({ type: 'house', x, y, door: 0, guests: false });   // в начало списка: дом рисуется позади всех
      else if (ch === 'G') objects.push({ type: 'girl', x, y: y + TILE - 24, happy: false, inside: false, walk: 0 });
      else if ('tT*F'.includes(ch)) decor.push({ ch, x, y });
      else continue;                      // клетки карты (#, ~, S, L, =, B) остаются как есть
      tiles[ty][tx] = '.';
    }
  }
  bg = buildBackground(theme);
  levelCanvas = renderLevel(decor);
  camX = clamp(cat.x - W * 0.4, 0, cols * TILE - W);
}

// ---------------------------------------------------------------------
// 9. КОШКА ЛАПКА
// ---------------------------------------------------------------------
const cat = {
  x: 0, y: 0, w: 16, h: 12,      // «коробка» столкновений — меньше картинки 24×16
  vx: 0, vy: 0,
  onGround: false,
  facing: 1,                     // 1 — смотрит вправо, −1 — влево
  coyote: 0,                     // ещё пару кадров после края обрыва прыгать можно
  jumpBuffer: 0,                 // нажал прыжок чуть раньше приземления — всё равно прыгнет
  anim: 0, blink: 0,
  invuln: 0,                     // после возрождения кошка мигает и ничего не боится
  hidden: false, inBox: false, dead: false, deathReason: '',
};

// Ставим кошку на клетку (x, y) — лапами на землю
function placeCat(x, y) {
  Object.assign(cat, {
    x, y: y + TILE - cat.h, vx: 0, vy: 0, onGround: true, facing: 1,
    coyote: 0, jumpBuffer: 0, anim: 0, invuln: 0,
    hidden: false, inBox: false, dead: false,
  });
}

function updateCat() {
  // Разгон и торможение: кошка не стартует и не останавливается мгновенно
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir !== 0) {
    cat.vx += dir * (cat.onGround ? 0.25 : 0.18);
    cat.facing = dir;
  } else {
    cat.vx *= cat.onGround ? 0.7 : 0.93;
    if (Math.abs(cat.vx) < 0.05) cat.vx = 0;
  }
  cat.vx = clamp(cat.vx, -RUN_SPEED, RUN_SPEED);

  // Прыжок. Два «запаса» делают управление мягким:
  // coyote — можно прыгнуть, даже если уже чуть сошёл с края,
  // jumpBuffer — нажатие незадолго до приземления не пропадает
  if (pressed.jump) cat.jumpBuffer = 8;
  else if (cat.jumpBuffer > 0) cat.jumpBuffer--;
  cat.coyote = cat.onGround ? 7 : Math.max(0, cat.coyote - 1);
  if (cat.jumpBuffer > 0 && cat.coyote > 0) {
    cat.vy = -JUMP_SPEED;
    cat.jumpBuffer = 0;
    cat.coyote = 0;
    cat.onGround = false;
    sfx.jump();
    dust(cat.x + cat.w / 2, cat.y + cat.h);
  }
  // Кнопку отпустили раньше — прыжок пониже. Но даже самый короткий тап
  // (на телефоне так и тапают) даёт прыжок, которого хватает на мухомор и ручей
  if (!input.jump && cat.vy < -4.5) cat.vy = -4.5;

  // Падение и движение с учётом стен, земли и мостиков
  const wasInAir = !cat.onGround, fallSpeed = cat.vy;
  cat.vy = Math.min(cat.vy + GRAVITY, MAX_FALL);
  moveX(cat);
  const head = moveY(cat);
  if (head) hitFromBelow(head);
  if (cat.onGround && wasInAir && fallSpeed > 3) dust(cat.x + cat.w / 2, cat.y + cat.h);

  // Анимация: бег, моргание, мигание после возрождения
  if (cat.onGround && Math.abs(cat.vx) > 0.3) cat.anim += Math.abs(cat.vx) * 0.13;
  else cat.anim = 0;
  if (cat.blink > 0) cat.blink--;
  else if (Math.random() < 0.006) cat.blink = 8;
  if (cat.invuln > 0) cat.invuln--;

  // Вода и пропасть
  const tx = Math.floor((cat.x + cat.w / 2) / TILE), feet = cat.y + cat.h;
  if (tx >= 0 && tx < cols && tileAt(tx, Math.floor((feet - 1) / TILE)) === '~' && feet > waterTop(tx) + 4) {
    killCat('water');
  } else if (cat.y > H + 24) {
    killCat('fall');
  }
}

// Кошка ударилась головой о клетку снизу
function hitFromBelow({ tx, ty }) {
  if (tileAt(tx, ty) !== 'B') {
    sfx.bonk();
    return;
  }
  tiles[ty][tx] = 'b';                  // коробка опустела
  bumps.push({ tx, ty, t: 0 });
  sfx.box();
  effects.push({ img: SPR.fish, x: tx * TILE + 2, y: ty * TILE - 8, vx: 0, vy: -2.6, gravity: 0.12, life: 30 });
  collectFish(tx * TILE + 8, ty * TILE - 6);
}

function collectFish(x, y) {
  fishCount++;
  score += 100;
  sfx.fish();
  sparkle(x, y);
  if (fishCount % FISH_FOR_LIFE === 0) {
    if (lives < START_LIVES) {
      lives++;
      sfx.life();
      popup(x, y - 10, '+1 ♥', '#f85878');
    } else {
      score += 1000;
      popup(x, y - 10, '+1000', '#fce060');
    }
  }
}

function killCat(reason) {
  if (state !== 'play') return;
  state = 'dying';
  timer = 0;
  lives--;
  cat.dead = true;
  cat.deathReason = reason;
  cat.vx = 0;
  cat.vy = 0;
  stopMusic();
  if (reason === 'water') {
    const tx = Math.floor((cat.x + cat.w / 2) / TILE);
    splash(cat.x + cat.w / 2, waterTop(tx));
    sfx.splash();
    cat.hidden = true;                  // кошка скрылась под водой
  } else {
    sfx.hurt();
  }
}

function updateDying() {
  // Мухомор или ёж: кошка подпрыгивает и падает с экрана вверх лапами
  if (cat.deathReason !== 'water' && cat.deathReason !== 'fall') {
    if (timer === 25) cat.vy = -5;
    if (timer > 25) {
      cat.vy = Math.min(cat.vy + GRAVITY, MAX_FALL);
      cat.y += cat.vy;
    }
  }
  if (timer === 30) playJingle('sad');
  if (timer < 120) return;
  if (lives > 0) {
    respawn();
  } else {
    state = 'gameover';
    timer = 0;
    saveRecord();
    playJingle('gameover');
  }
}

// Возвращаемся к последнему флажку
function respawn() {
  placeCat(checkpoint.x, checkpoint.y);
  cat.invuln = 120;
  camX = clamp(cat.x - W * 0.4, 0, cols * TILE - W);
  state = 'play';
  timer = 0;
  playMusic(level.music);
}

function updateCamera() {
  const target = cat.x + cat.w / 2 - W * 0.4;   // кошка чуть левее центра — видно, что впереди
  camX += (target - camX) * 0.12;
  camX = clamp(camX, 0, cols * TILE - W);
}

// ---------------------------------------------------------------------
// 10. ОБЪЕКТЫ: рыбки, мухоморы, ежи, рыбы в реке, флажки, выход, дом
// ---------------------------------------------------------------------
function updateObjects() {
  // Для опасностей берём «коробку» кошки поменьше: задеть мухомор краешком не страшно
  const hurtBox = { x: cat.x + 3, y: cat.y + 3, w: cat.w - 6, h: cat.h - 4 };
  const catReady = !cat.inBox && !cat.hidden;
  const safe = cat.invuln > 0;
  for (const o of objects) {
    switch (o.type) {
      case 'fish':
        if (catReady && overlap(cat, o)) {
          o.taken = true;
          collectFish(o.x + 6, o.y + 4);
        }
        break;
      case 'shroom':
        if (catReady && !safe && overlap(hurtBox, o)) killCat('shroom');
        break;
      case 'hog':
        updateHog(o);
        if (catReady && !safe && overlap(hurtBox, o)) killCat('hog');
        break;
      case 'jumper':
        updateJumper(o);
        if (catReady && o.flying && overlap(cat, o)) {
          o.taken = true;
          score += 500;
          sfx.catch();
          sparkle(o.x + 4, o.y + 6);
          popup(o.x + 4, o.y - 6, 'НЯМ! +500', '#fce060');
        }
        break;
      case 'flag':
        if (o.active) o.raise++;
        else if (catReady && cat.x > o.x - 8) {
          o.active = true;
          checkpoint = { x: o.x, y: o.y };
          sfx.flag();
          popup(o.x + 8, o.y - 32, 'СОХРАНЕНО', '#fcfcfc');
        }
        break;
      case 'exit':
        if (catReady && cat.x + cat.w / 2 > o.x + 8) levelClear();
        break;
      case 'house':
        houseSmoke(o);
        // Если у дома никто не ждёт, игра заканчивается у двери
        if (catReady && !objects.some(g => g.type === 'girl') && cat.x + cat.w / 2 > o.x - 10) reachHome();
        break;
      case 'girl':
        // Соня зовёт кошку, когда та уже близко, а встреча с ней — конец игры
        if (catReady && Math.abs(o.x - cat.x) < 220 && frameCount % 170 === 0) bubble(o.x + 8, o.y - 2, 'КИС-КИС!', 80);
        if (catReady && cat.x + cat.w > o.x - 6) reachHome();
        break;
    }
    if (state !== 'play') break;      // кошка погибла или уровень закончился — дальше не проверяем
  }
  objects = objects.filter(o => !o.taken);
}

// Ёжик ходит туда-сюда около своего места: у стены, у края обрыва
// и в двух с половиной клетках от дома поворачивает — так его легко обойти
function updateHog(o) {
  if (!o.active) {
    if (o.x > camX + W + 32) return;  // оживает, только когда появится на экране
    o.active = true;
  }
  if (Math.abs(o.x - o.homeX) > 40 && Math.sign(o.x - o.homeX) === o.dir) o.dir = -o.dir;
  o.vx = o.dir * 0.35;
  if (moveX(o)) o.dir = -o.dir;
  o.vy = Math.min(o.vy + GRAVITY, MAX_FALL);
  moveY(o);
  if (o.onGround) {
    const aheadX = o.dir > 0 ? o.x + o.w + 1 : o.x - 1;
    const ahead = tileAt(Math.floor(aheadX / TILE), Math.floor((o.y + o.h + 2) / TILE));
    if (!isSolid(ahead) && ahead !== '=') o.dir = -o.dir;
  }
  if (o.y > H + 32) o.taken = true;
  o.anim++;
}

// Рыба в реке время от времени выпрыгивает — поймай её в прыжке
function updateJumper(o) {
  if (!o.flying) {
    if (--o.wait > 0) return;
    if (Math.abs(o.homeX - (camX + W / 2)) > W * 0.75) {   // прыгает, только когда кошка рядом
      o.wait = 30;
      return;
    }
    o.flying = true;
    o.x = o.homeX;
    o.y = GROUND_Y + 8;
    o.vy = -5.4;
    splash(o.x + 4, GROUND_Y + 5, 5);
    sfx.drip();
    return;
  }
  o.vy += 0.16;
  o.y += o.vy;
  if (o.vy > 0 && o.y > GROUND_Y + 8) {
    o.flying = false;
    o.wait = 100 + Math.floor(Math.random() * 80);
    splash(o.x + 4, GROUND_Y + 5, 5);
  }
}

// Начало игры: коробка шуршит, открывается, кошка выглядывает и выпрыгивает
function updateStartBox(box) {
  box.t++;
  box.shake = (box.t > 25 && box.t < 45) || (box.t > 60 && box.t < 80);
  if (box.t === 26 || box.t === 61) sfx.rustle();
  if (box.t === 95) {
    box.open = true;
    sfx.pop();
  }
  if (box.open) box.peek = Math.max(0, 9 - (box.t - 95));   // голова медленно поднимается
  if (box.t === 112) bubble(box.x + 12, box.y - 4, 'ГДЕ Я?', 70);
  if (box.t === 190) {
    cat.inBox = false;
    cat.hidden = false;
    cat.x = box.x + 4;
    cat.y = box.y + 2;
    cat.vx = 1.2;
    cat.vy = -5.2;
    cat.onGround = false;
    cat.facing = 1;
    sfx.meow();
    playMusic(level.music);
  }
}

// Дым из трубы дома
function houseSmoke(o) {
  if (frameCount % 24 === 0) {
    effects.push({ x: o.x + 32, y: o.y + TILE - 104, vx: 0.15, vy: -0.35, gravity: 0, life: 90, color: '#e8e0d8', size: 2 });
  }
}

// ---------------------------------------------------------------------
// 11. ЭФФЕКТЫ: пыль, искры, брызги, всплывающие надписи
// ---------------------------------------------------------------------
function particle(x, y, vx, vy, color, life, gravity = 0.15, size = 1) {
  effects.push({ x, y, vx, vy, color, life, gravity, size });
}
function dust(x, y) {
  for (let i = 0; i < 4; i++) particle(x + (Math.random() - 0.5) * 10, y - 1, (Math.random() - 0.5) * 0.8, -Math.random() * 0.5, '#e8dcc0', 14, 0.02);
}
function sparkle(x, y) {
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2;
    particle(x, y, Math.cos(a) * 1.2, Math.sin(a) * 1.2, i % 2 ? '#fcfcfc' : '#f8d800', 16, 0);
  }
}
function splash(x, y, count = 14) {
  for (let i = 0; i < count; i++) {
    particle(x + (Math.random() - 0.5) * 10, y, (Math.random() - 0.5) * 2, -1.5 - Math.random() * 2.5,
      i % 3 ? theme.water[0] : '#fcfcfc', 40, 0.18, 2);
  }
}
function popup(x, y, str, color = '#fcfcfc') { popups.push({ x, y, text: str, color, t: 55 }); }
function bubble(x, y, str, t = 90) { popups.push({ x, y, text: str, bubble: true, t }); }

let toast = { text: '', t: 0 };
function showToast(str) { toast = { text: str, t: 90 }; }

function updateEffects() {
  for (const p of effects) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.life--;
  }
  effects = effects.filter(p => p.life > 0);
  for (const p of popups) {
    p.t--;
    if (!p.bubble) p.y -= 0.5;
  }
  popups = popups.filter(p => p.t > 0);
  for (const b of bumps) b.t++;
  bumps = bumps.filter(b => b.t < BUMP.length);
}
const BUMP = [0, 2, 4, 5, 5, 4, 2, 1];   // как подпрыгивает коробка от удара, по кадрам

// ---------------------------------------------------------------------
// 12. РИСОВАНИЕ
// ---------------------------------------------------------------------

// Слой фона шириной 512 повторяется по кругу
function drawLayer(img, offset, y = 0) {
  const x = -Math.floor(((offset % img.width) + img.width) % img.width);
  ctx.drawImage(img, x, y);
  if (x + img.width < W) ctx.drawImage(img, x + img.width, y);
}

// Чем дальше слой, тем медленнее он едет — получается объём
function drawBackground(b, cx) {
  ctx.drawImage(b.sky, 0, 0);
  for (let i = 0; i < 5; i++) {            // облака плывут сами по себе
    const span = 520;
    const x = ((i * 113 + 40 - cx * 0.08 - frameCount * 0.04) % span + span) % span - 60;
    ctx.drawImage(b.cloud, Math.round(x), 14 + (i * 37) % 60);
  }
  drawLayer(b.hills, cx * 0.12);
  drawLayer(b.mid, cx * 0.25);
  drawLayer(b.near, cx * 0.45);
}

// Коробка с рыбкой (или уже пустая)
function drawBox(x, y, full) {
  rect(ctx, x, y, 16, 16, '#3c1c08');
  rect(ctx, x + 1, y + 1, 14, 14, full ? '#d09850' : '#9c7040');
  rect(ctx, x + 1, y + 1, 14, 2, full ? '#ecc080' : '#b08050');
  rect(ctx, x + 1, y + 12, 14, 3, full ? '#a87030' : '#7c5028');
  rect(ctx, x + 7, y + 1, 2, 5, '#ecd8a8');                 // скотч
  if (!full) return;
  const c = frameCount % 50 < 8 ? '#fcfcfc' : '#f8b800';    // рыбка на коробке поблёскивает
  rect(ctx, x + 5, y + 7, 6, 3, c);
  rect(ctx, x + 3, y + 7, 1, 1, c);
  rect(ctx, x + 3, y + 9, 1, 1, c);
  rect(ctx, x + 4, y + 8, 1, 1, c);
  rect(ctx, x + 9, y + 8, 1, 1, '#3c1c08');
}

function drawBoxes(cx) {
  const c0 = Math.floor(cx / TILE), c1 = c0 + Math.ceil(W / TILE);
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = c0; tx <= c1; tx++) {
      const t = tileAt(tx, ty);
      if (t !== 'B' && t !== 'b') continue;
      const bump = bumps.find(b => b.tx === tx && b.ty === ty);
      drawBox(tx * TILE - cx, ty * TILE - (bump ? BUMP[bump.t] : 0), t === 'B');
    }
  }
}

// Вода рисуется поверх кошки — так она «уходит под воду»
function drawWater(cx) {
  const [light, mid, deep] = theme.water;
  const c0 = Math.max(0, Math.floor(cx / TILE)), c1 = Math.min(cols - 1, c0 + Math.ceil(W / TILE));
  for (let tx = c0; tx <= c1; tx++) {
    for (let ty = 0; ty < ROWS; ty++) {
      const t = tiles[ty][tx], x = tx * TILE - cx, y = ty * TILE;
      if (t === '=' && tileAt(tx, ty + 1) === '~') {         // вода под мостиком
        rect(ctx, x, y + 6, TILE, TILE - 6, mid);
        continue;
      }
      if (t !== '~') continue;
      const above = tileAt(tx, ty - 1);
      if (above === '~' || above === '=') {
        rect(ctx, x, y, TILE, TILE, deep);
        if ((tx + ty) % 3 === 0) rect(ctx, x + 4, y + 6, 3, 1, mid);
        continue;
      }
      rect(ctx, x, y + 5, TILE, TILE - 5, mid);                // поверхность
      rect(ctx, x, y + 5, TILE, 2, light);
      const shift = (Math.floor(frameCount / 6) + tx * 5) % 13;   // бегущие блики
      rect(ctx, x + shift, y + 5, 3, 1, '#fcfcfc');
      rect(ctx, x + (shift + 7) % 14, y + 10, 2, 1, light);
    }
  }
}

function drawFlag(o, x) {
  const base = o.y + TILE, top = base - 30;
  rect(ctx, x + 7, top, 2, 30, '#8c8c8c');
  rect(ctx, x + 7, top, 1, 30, '#e0e0e0');
  rect(ctx, x + 6, top - 2, 4, 3, '#f8b800');
  const lift = o.active ? Math.min(1, o.raise / 30) : 0;
  const fy = Math.round(base - 12 - lift * 16);
  const color = o.active ? '#e82818' : '#a8a8a8';
  const wave = o.active && Math.floor(frameCount / 10) % 2 ? 1 : 0;
  for (let i = 0; i < 7; i++) rect(ctx, x + 9, fy + i + (i > 3 ? wave : 0), 9 - Math.abs(i - 3) * 2, 1, color);
}

function drawExitSign(x, y) {
  const base = y + TILE;
  rect(ctx, x + 6, base - 26, 4, 26, '#5c3010');
  rect(ctx, x + 7, base - 26, 1, 26, '#8c5424');
  rect(ctx, x - 13, base - 34, 42, 13, '#3c1c08');
  rect(ctx, x - 12, base - 33, 40, 11, '#d8a050');
  rect(ctx, x - 12, base - 33, 40, 1, '#f0c880');
  text('ДОМОЙ→', x - 9, base - 31, { color: '#4c2408' });
}

// Дом, куда кошка так спешила: бревенчатые стены, красная крыша, в окне горит свет
function drawHouse(o, x) {
  const g = o.y + TILE;                   // земля
  const left = x - 40;
  rect(ctx, x + 27, g - 100, 12, 36, '#8c3c1c');                 // труба
  rect(ctx, x + 25, g - 102, 16, 3, '#4c1c0c');
  for (let i = 0; i < 7; i++) {                                  // стены из брёвен
    const y = g - 56 + i * 8;
    rect(ctx, left, y, 96, 8, i % 2 ? '#9c5a24' : '#b06a2c');
    rect(ctx, left, y + 7, 96, 1, '#5c3010');
    rect(ctx, left - 3, y + 1, 4, 6, '#d8a060');                 // торцы брёвен
    rect(ctx, left + 95, y + 1, 4, 6, '#d8a060');
  }
  for (let i = 0; i < 36; i++) {                                 // крыша
    const hw = 58 - Math.floor(i * 1.55);
    rect(ctx, x + 8 - hw, g - 57 - i, hw * 2, 1, i % 6 === 0 ? '#7c1408' : '#b82818');
  }
  rect(ctx, x - 36, g - 44, 30, 20, '#4c2408');                  // окно
  rect(ctx, x - 34, g - 42, 26, 16, '#fce078');
  if (o.guests) {                                                // Соня и Лапка уже дома!
    ctx.drawImage(SPR.sonyaHappy, 2, 0, 12, 12, x - 34, g - 38, 12, 12);
    ctx.drawImage(SPR.catIdle, 14, 0, 9, 9, x - 19, g - 35, 9, 9);
  } else {
    rect(ctx, x - 34, g - 35, 26, 2, '#4c2408');                 // перекладина рамы
  }
  rect(ctx, x - 22, g - 42, 2, 16, '#4c2408');
  rect(ctx, x - 38, g - 24, 34, 3, '#6c3810');                   // подоконник
  rect(ctx, x - 2, g - 31, 20, 31, '#4c2408');                   // дверь
  if (o.door) {
    rect(ctx, x, g - 29, 16, 29, '#fcc860');
    rect(ctx, x, g - 29, 3, 29, '#8c5424');
  } else {
    rect(ctx, x, g - 29, 16, 29, '#7c4414');
    rect(ctx, x + 5, g - 29, 1, 29, '#5c3010');
    rect(ctx, x + 10, g - 29, 1, 29, '#5c3010');
    rect(ctx, x + 12, g - 16, 2, 2, '#f8d800');
  }
  rect(ctx, x - 5, g - 2, 26, 2, '#9c9c9c');                     // крыльцо
}

function drawStartBox(o, x) {
  const dx = o.shake ? (frameCount % 4 < 2 ? -1 : 1) : 0;
  if (!o.open) {
    drawSprite(SPR.boxClosed, x + dx, o.y);
    return;
  }
  drawSprite(SPR.boxOpen, x, o.y);
  if (cat.inBox) {
    // Голова кошки между стенками коробки, потом снова рисуем переднюю стенку поверх
    ctx.drawImage(SPR.catIdle, 14, 0, 9, 9, x + 8, o.y + o.peek, 9, 9);
    ctx.drawImage(SPR.boxOpen, 0, 7, 24, 9, x, o.y + 7, 24, 9);
  }
}

function drawObject(o, cx) {
  const x = Math.round(o.x - cx);
  if (x < -120 || x > W + 60) return;       // за экраном не рисуем
  switch (o.type) {
    case 'fish':
      drawSprite(SPR.fish, x, o.y + Math.round(Math.sin(frameCount / 12 + o.phase) * 1.5));
      break;
    case 'shroom':
      drawSprite(SPR.mushroom, o.sx - cx, o.sy);
      break;
    case 'hog':
      drawSprite(SPR.hog[Math.floor(o.anim / 10) % 2], x - 1, o.y + o.h - 16, o.dir < 0);
      break;
    case 'jumper':
      if (o.flying) drawSprite(o.vy < 0 ? SPR.fishUp : SPR.fishDown, x, o.y);
      break;
    case 'flag':     drawFlag(o, x); break;
    case 'exit':     drawExitSign(x, o.y); break;
    case 'house':    drawHouse(o, x); break;
    case 'girl': {
      if (o.inside) break;                    // уже зашла в дом
      // Идёт — переставляет ноги; обрадовалась — подпрыгивает на месте
      const img = o.walk ? (Math.floor(o.walk / 10) % 2 ? SPR.sonyaStep : SPR.sonyaHappy)
        : o.happy ? SPR.sonyaHappy : SPR.sonya;
      const hop = o.happy && !o.walk ? Math.round(Math.abs(Math.sin(frameCount / 5)) * 2) : 0;
      drawSprite(img, x, o.y - hop);
      break;
    }
    case 'startbox': drawStartBox(o, x); break;
  }
}

function drawCat(cx) {
  if (cat.hidden) return;
  if (cat.invuln > 0 && Math.floor(cat.invuln / 3) % 2 === 0) return;   // мигает
  let img;
  if (cat.dead) img = SPR.catBlink;
  else if (!cat.onGround && state === 'play') img = cat.vy < 0 ? SPR.catJump : SPR.catFall;
  else if (cat.anim > 0) img = SPR.catRun[Math.floor(cat.anim) % 4];
  else img = cat.blink > 0 ? SPR.catBlink : SPR.catIdle;
  const upsideDown = cat.dead && cat.deathReason !== 'water';
  drawSprite(img, cat.x + cat.w / 2 - 12 - cx, cat.y + cat.h - 16, cat.facing < 0, upsideDown);
}

// Облачко с репликой
function drawBubble(str, x, y) {
  const w = str.length * 6 + 5, h = 13;
  const left = Math.round(x - w / 2), top = Math.round(y - h - 4);
  rect(ctx, left + 1, top, w - 2, h, '#000');
  rect(ctx, left, top + 1, w, h - 2, '#000');
  rect(ctx, left + 1, top + 1, w - 2, h - 2, '#fcfcfc');
  rect(ctx, x - 1, top + h - 1, 3, 2, '#fcfcfc');
  rect(ctx, x - 2, top + h - 1, 1, 3, '#000');
  rect(ctx, x + 2, top + h - 1, 1, 2, '#000');
  rect(ctx, x - 1, top + h + 1, 3, 1, '#000');
  text(str, left + 3, top + 3, { color: '#000' });
}

function drawEffects(cx) {
  for (const p of effects) {
    const x = Math.round(p.x - cx), y = Math.round(p.y);
    if (p.img) ctx.drawImage(p.img, x, y);
    else rect(ctx, x, y, p.size || 1, p.size || 1, p.color);
  }
  // Сначала надписи и сердечки, потом облачка с репликами — чтобы их всегда можно было прочитать
  for (const p of popups) {
    if (!p.bubble) text(p.text, p.x - cx, p.y, { align: 'center', color: p.color, shadow: '#000' });
  }
  for (const p of popups) {
    if (p.bubble) drawBubble(p.text, Math.round(p.x - cx), p.y);
  }
}

function drawWorld() {
  const cx = Math.round(camX);
  drawBackground(bg, cx);
  ctx.drawImage(levelCanvas, cx, 0, W, H, 0, 0, W, H);   // земля и украшения — одним куском
  drawBoxes(cx);
  for (const o of objects) drawObject(o, cx);
  drawCat(cx);
  drawWater(cx);
  drawEffects(cx);
}

// Полоса сверху: рыбки, очки, название уровня, жизни
function drawHUD() {
  ctx.drawImage(SPR.fish, 6, 4);
  text('×' + pad(fishCount, 2), 20, 5, { shadow: '#000' });
  text(pad(score, 6), 60, 5, { shadow: '#000' });
  text(level.name, 186, 5, { align: 'center', color: '#fce8a0', shadow: '#000' });
  text('♥', 276, 5, { color: '#f85878', shadow: '#000' });
  text('×' + lives, 282, 5, { shadow: '#000' });
}

// Затемнение ступеньками, как на приставке
function fadeOut(k) {
  const a = clamp(Math.floor(k * 5) / 5, 0, 1);
  if (a <= 0) return;
  ctx.fillStyle = `rgba(0, 0, 0, ${a})`;
  ctx.fillRect(0, 0, W, H);
}

function blinkOn() { return Math.floor(frameCount / 30) % 2 === 0; }
function confirmKey() { return isTouch ? 'СТАРТ' : 'ENTER'; }

// ---------------------------------------------------------------------
// 13. ЭКРАНЫ И ХОД ИГРЫ
//   title → story → intro → play ⇄ pause
//                             play → dying → play (с флажка) или gameover
//                             play → clear → intro следующего уровня
//                             play → home → ending → title
// ---------------------------------------------------------------------
let state = 'title';
let timer = 0;              // сколько кадров длится текущий экран
let frameCount = 0;
let levelIndex = 0;
let score = 0, fishCount = 0, lives = START_LIVES;
let record = 0;
try { record = Number(localStorage.getItem('cat-home-record')) || 0; } catch (e) { /* не страшно */ }

function saveRecord() {
  if (score <= record) return;
  record = score;
  try { localStorage.setItem('cat-home-record', String(record)); } catch (e) { /* не страшно */ }
}

const STORY = ['КОШКА ЛАПКА УСНУЛА В КОРОБКЕ...', 'А ПРОСНУЛАСЬ В ЛЕСУ!', '', 'ДОМА ЕЁ ЖДЁТ СОНЯ.', 'ПОМОГИ ЛАПКЕ НАЙТИ ДОРОГУ ДОМОЙ!'];
const STORY_LEN = STORY.join('').length;

// Картинки заставки: утренний лес, полоска земли и название игры
const titleBg = buildBackground(THEMES.morning);
const titleGround = makeCanvas(512, 40, g => {
  for (let tx = 0; tx < 32; tx++) {
    drawGroundTile(g, tx * TILE, 8, tx * 31, { top: true }, THEMES.morning);
    drawGroundTile(g, tx * TILE, 24, tx * 17 + 5, {}, THEMES.morning);
  }
});
const titleLogo = makeCanvas(222, 30, g => {
  const s = 'ДОРОГА ДОМОЙ';
  for (let dx = -2; dx <= 2; dx++) {
    for (let dy = -2; dy <= 4; dy++) paintText(g, s, 3 + dx, 3 + dy, '#3c1808', 3);   // толстый контур и тень
  }
  paintText(g, s, 3, 3, '#f8a830', 3);
  g.save();                                  // верхняя половина букв светлее — «металлический» блеск
  g.beginPath();
  g.rect(0, 0, 222, 3 + 9);
  g.clip();
  paintText(g, s, 3, 3, '#fce8a0', 3);
  g.restore();
});

function newGame() {
  score = 0;
  fishCount = 0;
  lives = START_LIVES;
  state = 'story';
  timer = 0;
}

function startLevel(i) {
  levelIndex = i;
  loadLevel(i);
  state = 'intro';
  timer = 0;
  stopMusic();
}

function beginPlay() {
  state = 'play';
  timer = 0;
  if (!cat.inBox) playMusic(level.music);   // на первом уровне музыка начнётся, когда кошка вылезет
}

function updatePlay() {
  if (pressed.pause || pressed.start) {
    pauseGame();
    return;
  }
  if (cat.inBox) updateStartBox(objects.find(o => o.type === 'startbox'));
  else updateCat();
  if (state !== 'play') return;
  updateObjects();
  updateCamera();
}

function pauseGame() {
  state = 'pause';
  sfx.pause();
  pauseMusic(true);
}
function resumeGame() {
  state = 'play';
  pauseMusic(false);
}
function autoPause() { if (state === 'play') pauseGame(); }

// Дошли до указателя «ДОМОЙ»
function levelClear() {
  state = 'clear';
  timer = 0;
  score += 1000;
  popup(cat.x + cat.w / 2, cat.y - 14, '+1000', '#fce060');
  stopMusic();
  playJingle('clear');
}
function updateClear() {
  cat.facing = 1;
  cat.onGround = true;
  cat.x += 1.5;                             // кошка сама убегает вправо
  cat.anim += 0.2;
  updateCamera();
  if (timer > 150) startLevel(levelIndex + 1);
}

// Добежали до дома, а там ждёт Соня
function reachHome() {
  const house = objects.find(o => o.type === 'house');
  const girl = objects.find(o => o.type === 'girl');
  state = 'home';
  timer = 0;
  score += 5000;
  popup(house.x + 8, house.y - 50, '+5000', '#fce060');
  cat.vx = 0;
  cat.anim = 0;
  cat.facing = 1;
  if (girl) {
    girl.happy = true;
    popups = popups.filter(p => !p.bubble);          // убираем «КИС-КИС!»
    bubble(girl.x + 8, girl.y - 2, 'ЛАПКА! ТЫ ВЕРНУЛАСЬ!', 110);
  }
  stopMusic();
  playJingle('home');
}

function heart(x, y) {
  popups.push({ x: x + Math.random() * 10 - 5, y, text: '♥', color: '#f85878', t: 55 });
}

// Финал: Соня радуется, потом обе заходят в дом и выглядывают из окошка
function updateHome() {
  const house = objects.find(o => o.type === 'house');
  const girl = objects.find(o => o.type === 'girl');
  const door = house.x + 8;                          // середина двери
  houseSmoke(house);
  if (timer === 30) sfx.meow();
  if (girl && timer < 120 && timer % 12 === 0) heart((girl.x + 8 + cat.x + cat.w / 2) / 2, GROUND_Y - 24);
  if (girl && timer === 125) bubble(girl.x + 8, girl.y - 2, 'ПОШЛИ ДОМОЙ!', 70);
  if (timer === 170) {
    house.door = 1;                                  // дверь открывается
    sfx.pop();
  }
  if (girl && timer > 180 && !girl.inside) {         // первой заходит Соня...
    girl.x += 0.6;
    girl.walk++;
    if (girl.x + 8 >= door) girl.inside = true;
  }
  if (timer > 200 && !cat.hidden) {                  // ...за ней Лапка
    cat.onGround = true;
    cat.x += 0.7;
    cat.anim += 0.12;
    if (cat.x + cat.w / 2 >= door) cat.hidden = true;
  }
  if (cat.hidden && (!girl || girl.inside) && !house.guests) {
    house.door = 0;
    house.guests = true;                             // и обе появляются в окошке
    house.guestsTime = timer;
    sfx.meow();
  }
  if (house.guests && timer % 16 === 0) heart(house.x - 20, house.y + TILE - 50);
  if (house.guests && timer - house.guestsTime > 150) {
    state = 'ending';
    timer = 0;
    saveRecord();
    playMusic('home');
  }
}

// После «ИГРА ОКОНЧЕНА» — снова с начала того же уровня
function continueGame() {
  score = 0;
  fishCount = 0;
  lives = START_LIVES;
  startLevel(levelIndex);
}

function update() {
  frameCount++;
  timer++;
  const confirm = pressed.start || pressed.jump;
  switch (state) {
    case 'title':
      if (actx && !music.name) playMusic('home');   // после первого нажатия заиграет музыка
      if (confirm) newGame();
      break;
    case 'story': {
      const shown = Math.floor(timer / 3);
      if (shown <= STORY_LEN && timer % 6 === 0) sfx.blip();
      if (confirm) {
        if (shown < STORY_LEN) timer = STORY_LEN * 3;   // сразу показать весь текст
        else startLevel(0);
      }
      break;
    }
    case 'intro':
      if (timer > 150 || (timer > 30 && confirm)) beginPlay();
      break;
    case 'play':     updatePlay(); break;
    case 'pause':    if (pressed.pause || pressed.start) resumeGame(); break;
    case 'dying':    updateDying(); break;
    case 'clear':    updateClear(); break;
    case 'home':     updateHome(); break;
    case 'gameover': if (timer > 60 && confirm) continueGame(); break;
    case 'ending':
      houseSmoke(objects.find(o => o.type === 'house'));
      if (timer > 90 && confirm) {
        state = 'title';
        timer = 0;
      }
      break;
  }
  if (state !== 'pause') updateEffects();
  if (toast.t > 0) toast.t--;
  updateMusic();
  for (const k in pressed) pressed[k] = false;
}

// ---- Экраны ----
function drawTitle() {
  const scroll = frameCount * 0.6;         // фон едет — кажется, что кошка бежит по лесу
  drawBackground(titleBg, scroll);
  drawLayer(titleGround, scroll, GROUND_Y - 8);
  drawSprite(SPR.catRun[Math.floor(frameCount / 6) % 4], 138, GROUND_Y - 16);
  ctx.drawImage(titleLogo, Math.floor((W - titleLogo.width) / 2), 24);
  text('8-БИТНОЕ ПРИКЛЮЧЕНИЕ КОШКИ ЛАПКИ', W / 2, 60, { align: 'center', shadow: '#000' });
  if (blinkOn()) text('НАЖМИ ' + confirmKey(), W / 2, 92, { align: 'center', color: '#fce060', shadow: '#000' });
  text('РЕКОРД ' + pad(record, 6), W / 2, 110, { align: 'center', shadow: '#000' });
  if (!isTouch) text('← → БЕГ   ↑ ПРЫЖОК   M ЗВУК', W / 2, 146, { align: 'center', shadow: '#000' });
}

function drawStory() {
  rect(ctx, 0, 0, W, H, '#000');
  drawSprite(SPR.boxClosed, W / 2 - 12, 34);
  for (let i = 0; i < 3; i++) {            // «Z-z-z» над коробкой
    const k = (frameCount / 40 + i / 3) % 1;
    text('Z', W / 2 + 8 + k * 14, 36 - k * 18, { color: k < 0.8 ? '#8c8cfc' : '#3c3c8c' });
  }
  let left = Math.floor(timer / 3);
  STORY.forEach((line, i) => {
    const part = line.slice(0, Math.max(0, left));
    left -= line.length;
    text(part, W / 2 - (line.length * 6 - 1) / 2, 72 + i * 13);
  });
  if (Math.floor(timer / 3) >= STORY_LEN && blinkOn()) {
    text(confirmKey() + ' - ДАЛЬШЕ', W / 2, 166, { align: 'center', color: '#fce060' });
  }
}

function drawIntro() {
  rect(ctx, 0, 0, W, H, '#000');
  text('УРОВЕНЬ ' + (levelIndex + 1), W / 2, 58, { align: 'center', color: '#bcbcbc' });
  text(level.name, W / 2, 74, { align: 'center', scale: 2, color: '#fcc048' });
  ctx.drawImage(SPR.catIdle, W / 2 - 30, 112);
  text('× ' + lives, W / 2 + 2, 120);
}

function drawGameOver() {
  rect(ctx, 0, 0, W, H, '#000');
  text('ИГРА ОКОНЧЕНА', W / 2, 64, { align: 'center', scale: 2, color: '#f83828' });
  text('ОЧКИ   ' + pad(score, 6), W / 2, 100, { align: 'center' });
  text('РЕКОРД ' + pad(record, 6), W / 2, 114, { align: 'center', color: '#bcbcbc' });
  if (timer > 60 && blinkOn()) text(confirmKey() + ' - ЕЩЁ РАЗ', W / 2, 150, { align: 'center', color: '#fce060' });
}

function drawPause() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);
  text('ПАУЗА', W / 2, 80, { align: 'center', scale: 2, shadow: '#000' });
  text(isTouch ? 'СТАРТ - ИГРАТЬ ДАЛЬШЕ' : 'P - ИГРАТЬ ДАЛЬШЕ', W / 2, 108, { align: 'center', color: '#fce060', shadow: '#000' });
}

function drawEnding() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(0, 0, W, H);
  text('ЛАПКА ДОМА!', W / 2, 26, { align: 'center', scale: 3, color: '#fcc048', shadow: '#3c1808' });
  text('СОНЯ И ЛАПКА СНОВА ВМЕСТЕ!', W / 2, 60, { align: 'center', color: '#f8a8c8', shadow: '#000' });
  text('СПАСИБО ЗА ИГРУ!', W / 2, 74, { align: 'center', shadow: '#000' });
  text('РЫБОК  ' + pad(fishCount, 3), W / 2, 98, { align: 'center', shadow: '#000' });
  text('ОЧКИ   ' + pad(score, 6), W / 2, 112, { align: 'center', shadow: '#000' });
  text('РЕКОРД ' + pad(record, 6), W / 2, 126, { align: 'center', color: '#bcbcbc', shadow: '#000' });
  if (timer > 90 && blinkOn()) text(confirmKey() + ' - ИГРАТЬ СНОВА', W / 2, 156, { align: 'center', color: '#fce060', shadow: '#000' });
}

function draw() {
  switch (state) {
    case 'title':    drawTitle(); break;
    case 'story':    drawStory(); break;
    case 'intro':    drawIntro(); break;
    case 'gameover': drawGameOver(); break;
    default:
      drawWorld();
      if (state !== 'ending') drawHUD();
      if (state === 'pause') drawPause();
      if (state === 'dying') fadeOut((timer - 90) / 30);
      if (state === 'clear') fadeOut((timer - 110) / 40);
      if (state === 'ending') drawEnding();
  }
  if (toast.t > 0) text(toast.text, W / 2, H - 14, { align: 'center', color: '#fce060', shadow: '#000' });
}


// ---------------------------------------------------------------------
// 14. ГЛАВНЫЙ ЦИКЛ
// Логика всегда считается 60 раз в секунду, даже на мониторе 120 или 144 Гц, —
// иначе на быстром мониторе кошка бегала бы вдвое быстрее
// ---------------------------------------------------------------------
const STEP = 1000 / 60;
let lastTime = performance.now(), acc = 0;

function loop(now) {
  acc += Math.min(now - lastTime, 250);    // после сворачивания вкладки не пытаемся «догнать» время
  lastTime = now;
  while (acc >= STEP) {
    update();
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
